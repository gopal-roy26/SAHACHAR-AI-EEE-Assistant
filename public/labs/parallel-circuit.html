<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Parallel Circuit Lab - SAHACHAR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            background-color: #06080e; color: #f1f5f9;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container {
            background: #0d121c; border: 1px solid #1e293b; border-radius: 16px;
            padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            max-width: 950px; width: 100%; text-align: center;
        }
        h2 { margin-top: 0; color: #8b5cf6; font-weight: 800;}
        
        .svg-wrapper {
            background: #0a0d14; border-radius: 12px; border: 1px solid #1e293b; 
            padding: 20px; margin-bottom: 20px;
            background-image: radial-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex; justify-content: center;
            overflow: hidden;
        }
        svg { width: 100%; max-width: 850px; height: auto; }
        
        .charge { 
            stroke-dasharray: 12 36; 
            animation: flow 2s linear infinite;
        }
        @keyframes flow { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; text-align: left; background: #0a0d14; padding: 20px; border-radius: 12px; border: 1px solid #1e293b;}
        .control-group { display: flex; flex-direction: column; gap: 8px; justify-content: center;}
        .control-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold;}
        input[type=range] { width: 100%; cursor: pointer; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: rgba(139, 92, 246, 0.1); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(139, 92, 246, 0.3);}
        .switch-label { font-size: 14px; font-weight: bold; color: #a78bfa; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #8b5cf6; }
        input:checked + .slider:before { transform: translateX(26px); }

        .math-box { margin-top: 15px; padding: 15px; background: rgba(139, 92, 246, 0.05); border: 1px solid rgba(139, 92, 246, 0.2); border-radius: 8px; font-family: monospace; font-size: 15px; color: #ddd6fe; line-height: 1.6;}
        .feedback-box { margin-top: 15px; padding: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 8px; font-size: 14px; font-weight: 600; color: #6ee7b7; text-align: center; transition: all 0.3s ease;}
        
        @media (max-width: 600px) { .controls { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h2>🛤️ Parallel Circuit (প্যারালাল সার্কিট) Analysis</h2>
    <p style="color:#94a3b8; font-size:13px; margin-bottom:20px;">সুইচ অন করুন এবং লক্ষ্য করুন কীভাবে প্যারালালে ভোল্টেজ সমান থাকে কিন্তু কারেন্ট ভাগ হয়ে যায়!</p>

    <div class="svg-wrapper">
        <svg viewBox="0 0 900 500">
            <defs>
                <filter id="glow-indigo"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                <filter id="glow-orange"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                <filter id="glow-green"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>

            <!-- ================= STATIC WIRES ================= -->
            <polyline points="150,240 150,150 230,150" fill="none" stroke="#334155" stroke-width="4"/>
            <polyline points="280,150 400,150" fill="none" stroke="#334155" stroke-width="4"/>
            <polyline points="400,150 650,150" fill="none" stroke="#334155" stroke-width="4"/>
            <polyline points="650,350 400,350 150,350 150,260" fill="none" stroke="#334155" stroke-width="4"/>

            <!-- ================= CIRCUIT SWITCH ================= -->
            <circle cx="230" cy="150" r="4" fill="#8b5cf6" />
            <circle cx="280" cy="150" r="4" fill="#8b5cf6" />
            <line id="svg-switch-blade" x1="230" y1="150" x2="275" y2="120" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" style="transition: all 0.3s ease; transform-origin: 230px 150px;"/>
            <text x="255" y="115" fill="#8b5cf6" font-size="13" font-weight="bold" text-anchor="middle" id="svg-switch-label">SW: OFF</text>

            <!-- ================= NODES ================= -->
            <circle cx="400" cy="150" r="6" fill="#38bdf8" />
            <text x="400" y="130" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">Node A</text>
            
            <circle cx="400" cy="350" r="6" fill="#38bdf8" />
            <text x="400" y="380" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">Node B</text>
            
            <circle cx="650" cy="150" r="5" fill="#64748b" />
            <circle cx="650" cy="350" r="5" fill="#64748b" />

            <!-- ================= COMPONENTS ================= -->
            <!-- Battery (Source) -->
            <line x1="120" y1="240" x2="180" y2="240" stroke="#ef4444" stroke-width="6"/> 
            <line x1="135" y1="260" x2="165" y2="260" stroke="#3b82f6" stroke-width="10"/> 
            <text x="105" y="245" fill="#ef4444" font-size="20" font-weight="bold">+</text>
            <text x="110" y="265" fill="#3b82f6" font-size="24" font-weight="bold">-</text>
            <text x="95" y="255" fill="#ef4444" font-size="18" font-weight="bold" text-anchor="end" id="svg-v-val">12V</text>

            <!-- Resistor 1 (Branch 1) - x=400 -->
            <polyline points="400,150 400,210 380,220 420,240 380,260 420,280 380,300 400,310 400,350" fill="none" stroke="#f59e0b" stroke-width="4"/>
            <!-- R1 Label -->
            <text x="435" y="260" fill="#f59e0b" font-size="16" font-weight="bold" text-anchor="start" id="svg-r1-val">R1 = 10Ω</text>
            <!-- V1 Drop Indicator -->
            <path d="M 370 200 Q 330 250 370 300" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
            <text x="320" y="255" fill="#f59e0b" font-size="15" font-weight="bold" text-anchor="end" id="svg-v1-val">V1 = 0.00V</text>

            <!-- Resistor 2 (Branch 2) - x=650 -->
            <polyline points="650,150 650,210 630,220 670,240 630,260 670,280 630,300 650,310 650,350" fill="none" stroke="#10b981" stroke-width="4"/>
            <!-- R2 Label -->
            <text x="615" y="260" fill="#10b981" font-size="16" font-weight="bold" text-anchor="end" id="svg-r2-val">R2 = 20Ω</text>
            <!-- V2 Drop Indicator -->
            <path d="M 680 200 Q 720 250 680 300" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
            <text x="730" y="255" fill="#10b981" font-size="15" font-weight="bold" text-anchor="start" id="svg-v2-val">V2 = 0.00V</text>

            <!-- ================= CURRENT ARROWS & LABELS ================= -->
            <!-- I_total_in -->
            <polyline points="140,200 150,190 160,200" fill="none" stroke="#8b5cf6" stroke-width="3"/>
            <text x="135" y="195" fill="#8b5cf6" font-size="15" font-weight="bold" text-anchor="end" id="svg-itot-in">I_total = 0.00A</text>

            <!-- I_total_out -->
            <polyline points="140,320 150,310 160,320" fill="none" stroke="#8b5cf6" stroke-width="3"/>
            <text x="135" y="315" fill="#8b5cf6" font-size="15" font-weight="bold" text-anchor="end" id="svg-itot-out">I_total = 0.00A</text>

            <!-- I_1 (Branch 1) -->
            <polyline points="390,170 400,180 410,170" fill="none" stroke="#f59e0b" stroke-width="3"/>
            <text x="385" y="185" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="end" id="svg-i1-val">I1 = 0.00A</text>

            <!-- I_2 (Branch 2) -->
            <polyline points="640,170 650,180 660,170" fill="none" stroke="#10b981" stroke-width="3"/>
            <text x="635" y="185" fill="#10b981" font-size="14" font-weight="bold" text-anchor="end" id="svg-i2-val">I2 = 0.00A</text>

            <!-- ================= ANIMATED CHARGE FLOW ================= -->
            <!-- Main In (Source to Node A) -->
            <path id="anim-main-in" class="charge" d="M 150 240 L 150 150 L 230 150 M 280 150 L 400 150" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" filter="url(#glow-indigo)" style="display: none;"/>
            
            <!-- Branch 1 (Node A through R1 to Node B) -->
            <path id="anim-branch1" class="charge" d="M 400 150 L 400 210 L 380 220 L 420 240 L 380 260 L 420 280 L 380 300 L 400 310 L 400 350" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" filter="url(#glow-orange)" style="display: none;"/>
            
            <!-- FIXED: Branch 2 (Continuous from Node A -> R2 -> Node B) -->
            <path id="anim-branch2" class="charge" d="M 400 150 L 650 150 L 650 210 L 630 220 L 670 240 L 630 260 L 670 280 L 630 300 L 650 310 L 650 350 L 400 350" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" filter="url(#glow-green)" style="display: none;"/>
            
            <!-- Main Out (Node B back to Source) -->
            <path id="anim-main-out" class="charge" d="M 400 350 L 150 350 L 150 260" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" filter="url(#glow-indigo)" style="display: none;"/>
        </svg>
    </div>

    <div class="feedback-box" id="feedback-output">
        💡 সার্কিটটি এখন অফ আছে। মেইন সুইচটি অন করুন!
    </div>

    <div class="controls">
        <div class="switch-container">
            <span class="switch-label">🔌 Main Switch</span>
            <label class="toggle-switch">
                <input type="checkbox" id="main-switch">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-group">
            <div class="control-header"><span style="color:#ef4444">⚡ V_Source (V)</span> <span id="v-val" style="color:#f1f5f9">12V</span></div>
            <input type="range" id="v-slider" min="1" max="36" value="12" style="accent-color: #ef4444;">
        </div>
        <div class="control-group">
            <div class="control-header"><span style="color:#f59e0b">🚧 Load 1 (R1)</span> <span id="r1-val" style="color:#f1f5f9">10Ω</span></div>
            <input type="range" id="r1-slider" min="1" max="50" value="10" style="accent-color: #f59e0b;">
        </div>
        <div class="control-group" style="grid-column: span 3;">
            <div class="control-header"><span style="color:#10b981">🚧 Load 2 (R2)</span> <span id="r2-val" style="color:#f1f5f9">20Ω</span></div>
            <input type="range" id="r2-slider" min="1" max="50" value="20" style="accent-color: #10b981;">
        </div>
    </div>

    <div class="math-box" id="math-output">
        <!-- Math injects here -->
    </div>
</div>

<script>
    const switchInput = document.getElementById('main-switch');
    const vSlider = document.getElementById('v-slider');
    const r1Slider = document.getElementById('r1-slider');
    const r2Slider = document.getElementById('r2-slider');
    
    // UI Elements
    const vVal = document.getElementById('v-val');
    const r1Val = document.getElementById('r1-val');
    const r2Val = document.getElementById('r2-val');
    
    // SVG Elements 
    const svgSwitchBlade = document.getElementById('svg-switch-blade');
    const svgSwitchLabel = document.getElementById('svg-switch-label');
    const svgV = document.getElementById('svg-v-val');
    const svgR1 = document.getElementById('svg-r1-val');
    const svgR2 = document.getElementById('svg-r2-val');
    const svgV1 = document.getElementById('svg-v1-val');
    const svgV2 = document.getElementById('svg-v2-val');
    
    const svgItotIn = document.getElementById('svg-itot-in');
    const svgItotOut = document.getElementById('svg-itot-out');
    const svgI1 = document.getElementById('svg-i1-val');
    const svgI2 = document.getElementById('svg-i2-val');
    
    const mathOut = document.getElementById('math-output');
    const feedbackOut = document.getElementById('feedback-output');
    
    // Animations
    const animMainIn = document.getElementById('anim-main-in');
    const animBranch1 = document.getElementById('anim-branch1');
    const animBranch2 = document.getElementById('anim-branch2'); // This now contains the full path for Branch 2
    const animMainOut = document.getElementById('anim-main-out');

    let prevV = 12, prevR1 = 10, prevR2 = 20;

    function updateSim() {
        const isClosed = switchInput.checked;
        const V = parseFloat(vSlider.value);
        const R1 = parseFloat(r1Slider.value);
        const R2 = parseFloat(r2Slider.value);

        // Parallel Circuit Calculations
        const R_eq = (R1 * R2) / (R1 + R2);
        let I_total = 0;
        let I1 = 0;
        let I2 = 0;

        // Visual Switch State
        if (isClosed) {
            svgSwitchBlade.setAttribute('x2', '280');
            svgSwitchBlade.setAttribute('y2', '150');
            svgSwitchLabel.textContent = "SW: ON";
            svgSwitchLabel.setAttribute('fill', '#10b981'); 
            
            // Calculate active values
            I1 = V / R1;
            I2 = V / R2;
            I_total = I1 + I2;
            
            // Show all flow paths
            [animMainIn, animBranch1, animBranch2, animMainOut].forEach(el => el.style.display = "block");
            
            // Apply Dynamic Animation Speeds using a reliable trick (Force Reflow)
            const applyAnim = (el, speed) => {
                el.style.animation = 'none';
                void el.offsetWidth; // Force Reflow
                el.style.animation = `flow ${speed}s linear infinite`;
            };

            const speedTotal = I_total > 0 ? Math.max(0.15, 2.5 / I_total) : 0;
            const speed1 = I1 > 0 ? Math.max(0.15, 2.5 / I1) : 0;
            const speed2 = I2 > 0 ? Math.max(0.15, 2.5 / I2) : 0;

            applyAnim(animMainIn, speedTotal);
            applyAnim(animMainOut, speedTotal);
            applyAnim(animBranch1, speed1);
            applyAnim(animBranch2, speed2); // Animates Node A -> R2 -> Node B perfectly

        } else {
            svgSwitchBlade.setAttribute('x2', '275');
            svgSwitchBlade.setAttribute('y2', '120');
            svgSwitchLabel.textContent = "SW: OFF";
            svgSwitchLabel.setAttribute('fill', '#8b5cf6'); 
            
            // Hide all flow paths
            [animMainIn, animBranch1, animBranch2, animMainOut].forEach(el => el.style.display = "none");
        }

        // Feedback Logic
        if (!isClosed) {
            feedbackOut.innerHTML = "🚫 <strong>সার্কিট ওপেন!</strong> কোনো কারেন্ট ফ্লো হচ্ছে না। মেইন সুইচটি অন করুন।";
            feedbackOut.style.background = "rgba(139, 92, 246, 0.1)";
            feedbackOut.style.color = "#ddd6fe";
        } else {
            feedbackOut.style.background = "rgba(16, 185, 129, 0.1)";
            feedbackOut.style.color = "#6ee7b7";
            if (V > prevV) feedbackOut.innerHTML = "⚡ ভোল্টেজ বাড়ানো হয়েছে! ফলে দুটি ব্রাঞ্চেই কারেন্ট ফ্লো বৃদ্ধি পেয়েছে।";
            else if (R1 > prevR1) feedbackOut.innerHTML = "🚧 <strong>R1</strong> বাড়ানো হয়েছে। তাই ব্রাঞ্চ-১ এ কারেন্ট কমে গেছে, কিন্তু <strong>R2</strong> ব্রাঞ্চে কোনো প্রভাব পড়েনি!";
            else if (R2 > prevR2) feedbackOut.innerHTML = "🚧 <strong>R2</strong> বাড়ানো হয়েছে। তাই ব্রাঞ্চ-২ এ কারেন্ট কমে গেছে, কিন্তু <strong>R1</strong> ব্রাঞ্চে কারেন্ট অপরিবর্তিত আছে!";
            else feedbackOut.innerHTML = "✅ সার্কিট ক্লোজড! প্যারালালে ভোল্টেজ (V) সমান থাকে, কিন্তু কারেন্ট রাস্তা অনুযায়ী ভাগ হয়ে যায়।";
        }
        
        prevV = V; prevR1 = R1; prevR2 = R2;

        // Update Standard HTML Text
        vVal.textContent = V + "V"; 
        r1Val.textContent = R1 + "Ω"; 
        r2Val.textContent = R2 + "Ω";
        
        // Update SVG Text
        svgV.textContent = V + "V"; 
        svgR1.textContent = "R1 = " + R1 + "Ω"; 
        svgR2.textContent = "R2 = " + R2 + "Ω";
        
        // Explicitly show V1 and V2 matching the Source Voltage
        svgV1.textContent = "V1 = " + (isClosed ? V : 0).toFixed(2) + "V";
        svgV2.textContent = "V2 = " + (isClosed ? V : 0).toFixed(2) + "V";
        
        svgItotIn.textContent = "I_total = " + I_total.toFixed(2) + "A";
        svgItotOut.textContent = "I_total = " + I_total.toFixed(2) + "A";
        svgI1.textContent = "I1 = " + I1.toFixed(2) + "A";
        svgI2.textContent = "I2 = " + I2.toFixed(2) + "A";

        // Update Math Box
        mathOut.innerHTML = `
            <div style="margin-bottom:12px; text-align:center;">
                তুল্য রোধ: <strong style="color:#fff">R<sub>eq</sub> = (R<sub>1</sub> × R<sub>2</sub>) ÷ (R<sub>1</sub> + R<sub>2</sub>)</strong> = <strong style="color:#38bdf8">${R_eq.toFixed(2)}Ω</strong>
            </div>
            <div style="display:flex; justify-content:space-around; flex-wrap:wrap; gap:10px; margin-bottom:12px; background:#1e1b4b; padding:10px; border-radius:8px;">
                <span style="color:#ef4444">V<sub>source</sub> = V<sub>1</sub> = V<sub>2</sub> = <strong>${V}V</strong> (সমান)</span>
                <span style="color:#f59e0b">I<sub>1</sub> = V ÷ R<sub>1</sub> = <strong>${I1.toFixed(2)}A</strong></span>
                <span style="color:#10b981">I<sub>2</sub> = V ÷ R<sub>2</sub> = <strong>${I2.toFixed(2)}A</strong></span>
            </div>
            <div style="font-weight:bold; color:#f1f5f9; text-align:center;">
                মোট কারেন্ট: I<sub>total</sub> = I<sub>1</sub> + I<sub>2</sub> = <strong style="color:#8b5cf6">${I_total.toFixed(2)}A</strong>
            </div>
        `;
    }

    switchInput.addEventListener('change', updateSim);
    vSlider.addEventListener('input', updateSim);
    r1Slider.addEventListener('input', updateSim);
    r2Slider.addEventListener('input', updateSim);

    // Initial load
    setTimeout(updateSim, 100);
</script>
</body>
</html>
