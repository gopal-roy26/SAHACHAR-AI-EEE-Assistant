<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium KVL Simulation - SAHACHAR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            background-color: #06080e; color: #f1f5f9;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container {
            background: #0d121c; border: 1px solid #1e293b; border-radius: 16px;
            padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            max-width: 850px; width: 100%; text-align: center;
        }
        h2 { margin-top: 0; color: #a855f7; font-weight: 800;}
        
        .svg-wrapper {
            background: #0a0d14; border-radius: 12px; border: 1px solid #1e293b; 
            padding: 20px; margin-bottom: 20px;
            background-image: radial-gradient(rgba(168, 85, 247, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex; justify-content: center;
        }
        svg { width: 100%; max-width: 750px; height: auto; }
        
        .charge { 
            stroke-dasharray: 12 36; 
        }
        @keyframes flow { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; text-align: left; background: #0a0d14; padding: 20px; border-radius: 12px; border: 1px solid #1e293b;}
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold;}
        input[type=range] { width: 100%; cursor: pointer; }
        
        .math-box { margin-top: 15px; padding: 15px; background: rgba(168, 85, 247, 0.05); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 8px; font-family: monospace; font-size: 15px; color: #d8b4fe;}
        
        .feedback-box { margin-top: 15px; padding: 12px; background: rgba(236, 72, 153, 0.1); border: 1px solid rgba(236, 72, 153, 0.3); border-radius: 8px; font-size: 14px; font-weight: 600; color: #fbcfe8; text-align: center; transition: all 0.3s ease;}
        
        @media (max-width: 600px) { .controls { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h2>🔄 KVL (Kirchhoff's Voltage Law) Virtual Lab</h2>
    <p style="color:#94a3b8; font-size:13px; margin-bottom:20px;">স্লাইডার নেড়ে রেজিস্ট্যান্স বা ভোল্টেজ পরিবর্তন করুন এবং ভোল্টেজ ড্রপ পর্যবেক্ষণ করুন</p>

    <div class="svg-wrapper">
        <!-- viewBox এর width 750 করে দেওয়া হয়েছে যাতে ডানদিকে জায়গা বাড়ে -->
        <svg viewBox="0 0 750 500">
            <defs>
                <filter id="glow-purple"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>

            <!-- ================= STATIC WIRES ================= -->
            <polyline points="150,240 150,150 280,150" fill="none" stroke="#334155" stroke-width="4"/>
            <polyline points="370,150 500,150 500,210" fill="none" stroke="#334155" stroke-width="4"/>
            <polyline points="500,290 500,350 150,350 150,260" fill="none" stroke="#334155" stroke-width="4"/>

            <!-- Corners / Nodes -->
            <circle cx="150" cy="150" r="5" fill="#a855f7" />
            <text x="135" y="145" fill="#a855f7" font-size="12" font-weight="bold">A</text>
            <circle cx="500" cy="150" r="5" fill="#a855f7" />
            <text x="510" y="145" fill="#a855f7" font-size="12" font-weight="bold">B</text>
            <circle cx="500" cy="350" r="5" fill="#a855f7" />
            <text x="510" y="360" fill="#a855f7" font-size="12" font-weight="bold">C</text>
            <circle cx="150" cy="350" r="5" fill="#a855f7" />
            <text x="135" y="360" fill="#a855f7" font-size="12" font-weight="bold">D</text>

            <!-- ================= COMPONENTS ================= -->
            <!-- Battery (Source) -->
            <line x1="120" y1="240" x2="180" y2="240" stroke="#ef4444" stroke-width="6"/> 
            <line x1="135" y1="260" x2="165" y2="260" stroke="#3b82f6" stroke-width="10"/> 
            <text x="105" y="245" fill="#ef4444" font-size="20" font-weight="bold">+</text>
            <text x="110" y="265" fill="#3b82f6" font-size="24" font-weight="bold">-</text>
            <text x="80" y="255" fill="#ef4444" font-size="16" font-weight="bold" text-anchor="end" id="svg-v-val">12V</text>
            <text x="80" y="275" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="end">Source</text>

            <!-- Resistor 1 (Top) -->
            <polyline points="280,150 288,130 303,170 318,130 333,170 348,130 362,150 370,150" fill="none" stroke="#f59e0b" stroke-width="4"/>
            <text x="325" y="190" fill="#f59e0b" font-size="16" font-weight="bold" text-anchor="middle" id="svg-r1-val">R1 = 10Ω</text>
            
            <!-- V1 Drop Indicator -->
            <path d="M 270 120 Q 325 80 380 120" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
            <text x="260" y="115" fill="#f59e0b" font-size="14" font-weight="bold">+</text>
            <text x="385" y="115" fill="#f59e0b" font-size="14" font-weight="bold">-</text>
            <text x="325" y="70" fill="#f59e0b" font-size="16" font-weight="bold" text-anchor="middle" id="svg-v1-val">V1 = 4.00V</text>

            <!-- Resistor 2 (Right) -->
            <polyline points="500,210 520,218 480,234 520,250 480,266 520,282 500,290" fill="none" stroke="#10b981" stroke-width="4"/>
            <text x="460" y="255" fill="#10b981" font-size="16" font-weight="bold" text-anchor="end" id="svg-r2-val">R2 = 20Ω</text>

            <!-- V2 Drop Indicator (Moved slightly inside and right boundary increased) -->
            <path d="M 530 200 Q 570 250 530 300" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
            <text x="535" y="195" fill="#10b981" font-size="14" font-weight="bold">+</text>
            <text x="535" y="310" fill="#10b981" font-size="14" font-weight="bold">-</text>
            <!-- x="580" এ যথেষ্ট স্পেস আছে এখন -->
            <text x="580" y="255" fill="#10b981" font-size="16" font-weight="bold" text-anchor="start" id="svg-v2-val">V2 = 8.00V</text>

            <!-- ================= CURRENT ARROW & LOOP ================= -->
            <!-- Circuit Current (I) Arrow -->
            <polyline points="205,140 215,150 205,160" fill="none" stroke="#a855f7" stroke-width="3"/>
            <text x="210" y="130" fill="#a855f7" font-size="15" font-weight="bold" text-anchor="middle" id="svg-i-val">I = 0.40A</text>

            <!-- Loop Direction Indicator -->
            <g transform="translate(325, 250)">
                <path d="M -30 0 A 30 30 0 1 1 30 0" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
                <polyline points="20,0 30,10 40,0" fill="none" stroke="#64748b" stroke-width="2"/>
                <text x="0" y="25" fill="#64748b" font-size="13" font-weight="bold" text-anchor="middle">Loop A-B-C-D</text>
            </g>

            <!-- ================= ANIMATED CHARGE FLOW ================= -->
            <path id="anim-charge" class="charge" d="M 150 240 L 150 150 L 500 150 L 500 350 L 150 350 L 150 260" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" filter="url(#glow-purple)"/>
            
        </svg>
    </div>

    <div class="feedback-box" id="feedback-output">
        💡 স্লাইডার নেড়ে ভোল্টেজ বা রেজিস্ট্যান্স পরিবর্তন করুন।
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="control-header"><span style="color:#ef4444">⚡ V_Source (V)</span> <span id="v-val" style="color:#f1f5f9">12V</span></div>
            <input type="range" id="v-slider" min="1" max="36" value="12" style="accent-color: #ef4444;">
        </div>
        <div class="control-group">
            <div class="control-header"><span style="color:#f59e0b">🚧 R1 (Top)</span> <span id="r1-val" style="color:#f1f5f9">10Ω</span></div>
            <input type="range" id="r1-slider" min="1" max="50" value="10" style="accent-color: #f59e0b;">
        </div>
        <div class="control-group">
            <div class="control-header"><span style="color:#10b981">🚧 R2 (Right)</span> <span id="r2-val" style="color:#f1f5f9">20Ω</span></div>
            <input type="range" id="r2-slider" min="1" max="50" value="20" style="accent-color: #10b981;">
        </div>
    </div>

    <div class="math-box" id="math-output">
        <!-- Math injects here -->
    </div>
</div>

<script>
    const vSlider = document.getElementById('v-slider');
    const r1Slider = document.getElementById('r1-slider');
    const r2Slider = document.getElementById('r2-slider');
    
    // UI Elements
    const vVal = document.getElementById('v-val');
    const r1Val = document.getElementById('r1-val');
    const r2Val = document.getElementById('r2-val');
    
    // SVG Elements (Using textContent is safer for SVG Text)
    const svgV = document.getElementById('svg-v-val');
    const svgR1 = document.getElementById('svg-r1-val');
    const svgR2 = document.getElementById('svg-r2-val');
    const svgV1 = document.getElementById('svg-v1-val');
    const svgV2 = document.getElementById('svg-v2-val');
    const svgI = document.getElementById('svg-i-val');
    
    const mathOut = document.getElementById('math-output');
    const feedbackOut = document.getElementById('feedback-output');
    const animCharge = document.getElementById('anim-charge');

    let prevV = 12, prevR1 = 10, prevR2 = 20;

    function updateSim() {
        const V = parseFloat(vSlider.value);
        const R1 = parseFloat(r1Slider.value);
        const R2 = parseFloat(r2Slider.value);

        // KVL Series Circuit Calculations
        const R_total = R1 + R2;
        const I = V / R_total;
        const V1 = I * R1;
        const V2 = I * R2;

        // Feedback Logic
        if (V > prevV) feedbackOut.innerHTML = "⚡ সোর্স ভোল্টেজ বাড়ানো হয়েছে! ফলে <strong>R1</strong> এবং <strong>R2</strong> উভয়ের আড়াআড়িতে ভোল্টেজ ড্রপ বৃদ্ধি পেয়েছে।";
        else if (V < prevV) feedbackOut.innerHTML = "🔋 সোর্স ভোল্টেজ কমানো হয়েছে, তাই ভোল্টেজ ড্রপ এবং কারেন্ট ফ্লো কমে গেছে।";
        else if (R1 > prevR1) feedbackOut.innerHTML = "🚧 <strong>R1</strong> বাড়ানো হয়েছে! লক্ষ্য করো, এখন R1 এর আড়াআড়িতে (V1) আগের চেয়ে বেশি ভোল্টেজ ড্রপ হচ্ছে।";
        else if (R1 < prevR1) feedbackOut.innerHTML = "✅ <strong>R1</strong> কমানো হয়েছে, ফলে V1 ড্রপ কমে গেছে এবং কারেন্ট ফ্লো কিছুটা বেড়েছে।";
        else if (R2 > prevR2) feedbackOut.innerHTML = "🚧 <strong>R2</strong> বাড়ানো হয়েছে! এখন সোর্স ভোল্টেজের বড় একটি অংশ R2 এর আড়াআড়িতে (V2) ড্রপ হচ্ছে।";
        else if (R2 < prevR2) feedbackOut.innerHTML = "✅ <strong>R2</strong> কমানো হয়েছে, ফলে V2 ড্রপ কমে গেছে এবং কারেন্ট ফ্লো কিছুটা বেড়েছে।";
        
        prevV = V; prevR1 = R1; prevR2 = R2;

        // Update Standard HTML Text
        vVal.textContent = V + "V"; 
        r1Val.textContent = R1 + "Ω"; 
        r2Val.textContent = R2 + "Ω";
        
        // Update SVG Text (using textContent to prevent browser issues)
        svgV.textContent = V + "V"; 
        svgR1.textContent = "R1 = " + R1 + "Ω"; 
        svgR2.textContent = "R2 = " + R2 + "Ω";
        svgI.textContent = "I = " + I.toFixed(2) + "A";
        svgV1.textContent = "V1 = " + V1.toFixed(2) + "V";
        svgV2.textContent = "V2 = " + V2.toFixed(2) + "V";

        // Update Math Box
        mathOut.innerHTML = `
            <div style="margin-bottom:8px; color:#94a3b8">KVL Equation (<span style="color:#a855f7">Loop A-B-C-D-A</span>): <strong style="color:#fff">V<sub>Source</sub> - V<sub>1</sub> - V<sub>2</sub> = 0</strong></div>
            <span style="color:#ef4444">V<sub>Source</sub> = ${V.toFixed(2)}V</span> &nbsp;|&nbsp; 
            <span style="color:#f59e0b">V<sub>1</sub> = ${V1.toFixed(2)}V</span> &nbsp;|&nbsp; 
            <span style="color:#10b981">V<sub>2</sub> = ${V2.toFixed(2)}V</span>
            <div style="margin-top:10px; font-weight:bold; color:#d8b4fe; background:#2e1065; padding:8px; border-radius:6px; display:flex; justify-content:space-around; flex-wrap:wrap; gap:10px;">
                <span>${V.toFixed(2)}V - ${V1.toFixed(2)}V - ${V2.toFixed(2)}V = 0</span>
                <span>বা, ${V.toFixed(2)}V = ${(V1 + V2).toFixed(2)}V</span>
            </div>
        `;

        // FIXED ANIMATION APPLY - Force Reflow to update speed smoothly
        const animSpeed = I > 0 ? Math.max(0.15, 2.0 / I) : 0;
        animCharge.style.animation = 'none'; // Reset
        void animCharge.offsetWidth;         // Trigger browser reflow
        animCharge.style.animation = `flow ${animSpeed}s linear infinite`; // Apply new speed
    }

    vSlider.addEventListener('input', updateSim);
    r1Slider.addEventListener('input', updateSim);
    r2Slider.addEventListener('input', updateSim);

    // Initial load
    setTimeout(updateSim, 100);
</script>
</body>
</html>
