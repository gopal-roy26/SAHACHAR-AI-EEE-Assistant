<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Ohm's Law Simulation - SAHACHAR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            background-color: #06080e; color: #f1f5f9;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container {
            background: #0d121c; border: 1px solid #1e293b; border-radius: 16px;
            padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            max-width: 800px; width: 100%; text-align: center;
        }
        h2 { margin-top: 0; color: #06b6d4; font-weight: 800;}
        
        .svg-wrapper {
            background: #0a0d14; border-radius: 12px; border: 1px solid #1e293b; 
            padding: 20px; margin-bottom: 20px;
            background-image: radial-gradient(rgba(6, 182, 212, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex; justify-content: center;
        }
        svg { width: 100%; max-width: 650px; height: auto; }
        
        .charge { 
            stroke-dasharray: 12 36; 
            animation: flow 2s linear infinite;
        }
        @keyframes flow { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; background: #0a0d14; padding: 25px; border-radius: 12px; border: 1px solid #1e293b;}
        .control-group { display: flex; flex-direction: column; gap: 10px; }
        .control-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;}
        input[type=range] { width: 100%; cursor: pointer; height: 6px; border-radius: 5px; outline: none; }
        
        .math-box { margin-top: 15px; padding: 15px; background: rgba(6, 182, 212, 0.05); border: 1px solid rgba(6, 182, 212, 0.2); border-radius: 8px; font-family: monospace; font-size: 16px; color: #67e8f9;}
        
        .feedback-box { margin-top: 15px; padding: 12px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 8px; font-size: 14px; font-weight: 600; color: #fde68a; text-align: center; transition: all 0.3s ease;}
        
        @media (max-width: 600px) { .controls { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Ohm's Law (ওহমের সূত্র) Virtual Lab</h2>
    <p style="color:#94a3b8; font-size:13px; margin-bottom:20px;">ভোল্টেজ এবং রেজিস্ট্যান্স পরিবর্তন করে কারেন্ট ফ্লো এর উপর প্রভাব পর্যবেক্ষণ করুন</p>

    <div class="svg-wrapper">
        <svg viewBox="0 0 650 400">
            <defs>
                <filter id="glow-cyan"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>

            <!-- ================= STATIC WIRES ================= -->
            <polyline points="150,300 150,150 280,150" fill="none" stroke="#334155" stroke-width="4"/>
            <polyline points="370,150 500,150 500,300 150,300" fill="none" stroke="#334155" stroke-width="4"/>

            <!-- ================= COMPONENTS ================= -->
            <!-- Battery (Source) -->
            <line x1="120" y1="215" x2="180" y2="215" stroke="#ef4444" stroke-width="6"/> <!-- Positive Plate -->
            <line x1="135" y1="235" x2="165" y2="235" stroke="#3b82f6" stroke-width="10"/> <!-- Negative Plate -->
            <text x="105" y="222" fill="#ef4444" font-size="22" font-weight="bold">+</text>
            <text x="110" y="242" fill="#3b82f6" font-size="26" font-weight="bold">-</text>
            <text x="90" y="232" fill="#ef4444" font-size="16" font-weight="bold" text-anchor="end" id="svg-v-val">V = 12V</text>
            <text x="90" y="252" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="end">Source</text>

            <!-- Resistor (Top) -->
            <polyline points="280,150 288,130 303,170 318,130 333,170 348,130 362,150 370,150" fill="none" stroke="#f59e0b" stroke-width="4"/>
            <text x="325" y="110" fill="#f59e0b" font-size="18" font-weight="bold" text-anchor="middle" id="svg-r-val">R = 10Ω</text>

            <!-- ================= CURRENT ARROW & LABELS ================= -->
            <!-- Circuit Current (I) Arrow -->
            <polyline points="205,140 215,150 205,160" fill="none" stroke="#06b6d4" stroke-width="3"/>
            <text x="210" y="125" fill="#06b6d4" font-size="16" font-weight="bold" text-anchor="middle" id="svg-i-val">I = 1.20A</text>

            <!-- ================= ANIMATED CHARGE FLOW ================= -->
            <!-- Single continuous path for simple loop -->
            <path id="anim-charge" class="charge" d="M 150 215 L 150 150 L 500 150 L 500 300 L 150 300 L 150 235" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" filter="url(#glow-cyan)"/>
            
        </svg>
    </div>

    <div class="feedback-box" id="feedback-output">
        💡 স্লাইডার নেড়ে ভোল্টেজ বা রেজিস্ট্যান্স পরিবর্তন করুন।
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="control-header"><span style="color:#ef4444">⚡ Voltage / Source (V)</span> <span id="v-val" style="color:#f1f5f9">12V</span></div>
            <input type="range" id="v-slider" min="1" max="48" value="12" style="accent-color: #ef4444;">
        </div>
        <div class="control-group">
            <div class="control-header"><span style="color:#f59e0b">🚧 Resistance / Load (R)</span> <span id="r-val" style="color:#f1f5f9">10Ω</span></div>
            <input type="range" id="r-slider" min="1" max="50" value="10" style="accent-color: #f59e0b;">
        </div>
    </div>

    <div class="math-box" id="math-output">
        <!-- Math injects here -->
    </div>
</div>

<script>
    const vSlider = document.getElementById('v-slider');
    const rSlider = document.getElementById('r-slider');
    
    // UI Elements
    const vVal = document.getElementById('v-val');
    const rVal = document.getElementById('r-val');
    
    // SVG Elements (Using textContent for reliable updates)
    const svgV = document.getElementById('svg-v-val');
    const svgR = document.getElementById('svg-r-val');
    const svgI = document.getElementById('svg-i-val');
    
    const mathOut = document.getElementById('math-output');
    const feedbackOut = document.getElementById('feedback-output');
    const animCharge = document.getElementById('anim-charge');

    let prevV = 12, prevR = 10;

    function updateSim() {
        const V = parseFloat(vSlider.value);
        const R = parseFloat(rSlider.value);

        // Ohm's Law Calculation
        const I = V / R;

        // Feedback Logic
        if (V > prevV) feedbackOut.innerHTML = "⚡ <strong>ভোল্টেজ (চাপ) বাড়ানো হয়েছে!</strong> কারেন্ট ভোল্টেজের সমানুপাতিক, তাই কারেন্ট ফ্লো বৃদ্ধি পেয়েছে।";
        else if (V < prevV) feedbackOut.innerHTML = "🔋 <strong>ভোল্টেজ কমানো হয়েছে।</strong> চাপ কম থাকায় সার্কিটে কারেন্ট ফ্লো কমে গেছে।";
        else if (R > prevR) feedbackOut.innerHTML = "🚧 <strong>রেজিস্ট্যান্স (বাধা) বাড়ানো হয়েছে!</strong> কারেন্ট রেজিস্ট্যান্সের ব্যস্তানুপাতিক, তাই বাধা পেয়ে কারেন্ট ফ্লো ধীর হয়ে গেছে।";
        else if (R < prevR) feedbackOut.innerHTML = "✅ <strong>রেজিস্ট্যান্স কমানো হয়েছে।</strong> বাধা কমে যাওয়ায় কারেন্ট এখন অনেক দ্রুত ফ্লো হচ্ছে।";
        
        prevV = V; prevR = R;

        // Update Text for HTML
        vVal.textContent = V + "V"; 
        rVal.textContent = R + "Ω"; 
        
        // Update SVG Text 
        svgV.textContent = "V = " + V + "V"; 
        svgR.textContent = "R = " + R + "Ω"; 
        svgI.textContent = "I = " + I.toFixed(2) + "A";

        // Update Math Box Display
        mathOut.innerHTML = `
            <div style="margin-bottom:8px; color:#94a3b8">Ohm's Law Equation: <strong style="color:#fff">I = V ÷ R</strong></div>
            <div style="display:flex; justify-content:space-around; align-items:center; flex-wrap:wrap; margin-top:12px;">
                <span style="color:#ef4444; font-size: 18px;">V = ${V}V</span>
                <span style="color:#475569; font-size: 20px;">|</span>
                <span style="color:#f59e0b; font-size: 18px;">R = ${R}Ω</span>
            </div>
            <div style="margin-top:15px; font-weight:bold; color:#06b6d4; background:#164e63; padding:12px; border-radius:6px; font-size:20px;">
                I = ${V} ÷ ${R} = ${I.toFixed(2)}A
            </div>
        `;

        // FIXED ANIMATION APPLY - Force Reflow to update speed smoothly based on Current (I)
        const animSpeed = I > 0 ? Math.max(0.1, 2.5 / I) : 0; 
        animCharge.style.animation = 'none'; // Reset
        void animCharge.offsetWidth;         // Trigger browser reflow
        animCharge.style.animation = `flow ${animSpeed}s linear infinite`; // Apply new dynamic speed
    }

    vSlider.addEventListener('input', updateSim);
    rSlider.addEventListener('input', updateSim);

    // Initial load
    setTimeout(updateSim, 100);
</script>
</body>
</html>
